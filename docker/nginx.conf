server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 엑셀 업로드/다운로드(jxls) 등 대용량 요청 대비
    client_max_body_size 20m;

    # API 요청은 백엔드로 프록시 — /api prefix를 그대로 전달(백엔드 컨트롤러가 /api/... 매핑)
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_pass_request_headers on;   # Cookie 등 원본 헤더 전달 (refresh 토큰 쿠키)
    }

    # ---- 캐시 정책 ----
    # 재배포 시 브라우저가 옛 번들을 계속 쓰는 문제를 막는다.
    # 원칙: 파일명에 해시가 붙는 것(assets/*)만 영구 캐시하고,
    #       진입점 HTML·서비스워커는 매 요청 서버에서 새로 받는다.

    # 해시 파일명 정적 자산(js·css·woff2·이미지) — Vite 가 내용이 바뀌면 파일명을 바꾸므로
    # 무효화가 필요 없다. immutable 로 재검증 요청조차 생략시킨다.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        # 없는 자산은 SPA 폴백으로 index.html 을 주지 않고 404 로 끝낸다
        # (JS 요청에 HTML 이 반환되어 MIME 오류가 나는 것을 방지)
        try_files $uri =404;
    }

    # 진입점 HTML — 절대 캐시하지 않는다. 여기에 최신 번들 해시가 들어있다.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # MSW 서비스워커 — 프로덕션에선 등록하지 않지만, 파일명이 고정이라 캐시되면 위험하다.
    location = /mockServiceWorker.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # SPA 폴백 — react-router 클라이언트 사이드 라우팅
    # (폴백은 /index.html 로 내부 리다이렉트되어 위 no-store 정책을 그대로 탄다)
    location / {
        try_files $uri /index.html;
    }
}
